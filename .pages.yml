content:
    - name: quiz_files
      label: All Quiz Files
      type: collection
      path: app/public/quiz
      format: json
      filename: "{primary}.json"
      view:
          fields:
              - title
              - category
              - primary
      fields:
          - name: title
            label: Quiz Title
            type: string
          - name: category
            label: Category (textbook or extra)
            type: string
          - name: subject
            label: Subject
            type: string
          - name: icon
            label: MDI Icon Name (e.g. mdiBeaker)
            type: string
          - name: color
            label: Color (e.g. green-darken-3)
            type: string
          - name: comingSoon
            label: Coming Soon
            type: boolean
          - name: chapters
            label: Chapters
            type: object
            list: true
            fields:
                - name: chapter
                  label: Chapter number
                  type: number
                - name: vocabulary
                  label: Vocabulary
                  type: object
                  list: true
                  fields:
                      - name: id
                        label: UUID
                        type: string
                      - name: expression
                        label: Expression
                        type: string
                      - name: sentence
                        label: Sentence
                        type: string
                      - name: sentence_blank
                        label: Sentence Blank
                        type: string
                      - name: correct
                        label: Correct
                        type: string
                      - name: correct_jp
                        label: Correct (JP)
                        type: string
                      - name: definitions
                        label: Definitions
                        type: string
                        list: true
